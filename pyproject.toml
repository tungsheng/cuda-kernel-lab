[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cuda-kernel-lab"
version = "0.1.0"
description = "CUDA kernel optimization strategy lab with reproducible GPU benchmarks."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "Tony Lee" }
]
dependencies = [
  "numpy>=1.24",
]

[project.scripts]
gpu-info = "cuda_kernel_lab.gpu_info:main"
benchmark-memory = "cuda_kernel_lab.benchmarks.memory_bandwidth:main"
benchmark-matmul = "cuda_kernel_lab.benchmarks.matmul:main"
benchmark-softmax = "cuda_kernel_lab.benchmarks.softmax:main"
benchmark-norms = "cuda_kernel_lab.benchmarks.norms:main"
benchmark-swiglu = "cuda_kernel_lab.benchmarks.swiglu:main"
benchmark-matrix = "cuda_kernel_lab.benchmark_matrix:main"
benchmark-report = "cuda_kernel_lab.benchmark_report:main"
nsight-summary = "cuda_kernel_lab.nsight_summary:main"

[project.optional-dependencies]
gpu = [
  "torch>=2.3",
  "triton>=2.3; platform_system == 'Linux'",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = [
  "cuda_kernel_lab*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
