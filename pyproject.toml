[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-kernel-lab"
version = "0.1.0"
description = "GPU kernel engineering lab for LLM inference primitives."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Tony Lee" }
]
dependencies = [
  "numpy>=1.24",
]

[project.scripts]
gpu-info = "inference_kernel_lab.gpu_info:main"

[project.optional-dependencies]
gpu = [
  "torch>=2.3",
  "triton>=2.3; platform_system == 'Linux'",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = [
  "inference_kernel_lab*",
  "kernels*",
  "benchmarks*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
